name: Semantic Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup Python + UV
        uses: ./.github/actions/setup-python-uv

      - name: Install semantic-release
        # 🔴 VERSIONS ARE PINNED DELIBERATELY — DO NOT REPLACE WITH UNPINNED NAMES.
        #
        # This install was unpinned until 2026-08-25, which made every release depend on
        # whatever npm happened to publish that day. It broke: `conventional-changelog-
        # conventionalcommits` shipped a 10.x major that refuses to render unless
        # `conventional-changelog-writer@9+` is loaded, but `@semantic-release/release-notes-
        # generator@14.1.1` nests writer 8.4.0. Every push to main then died with:
        #
        #   Missing helper: "conventional-changelog-conventionalcommits requires
        #   conventional-changelog-writer@9 or newer ..."
        #
        # The repo was silently unreleasable — the failure is in Actions, not in any local
        # gate, so nothing on the developer machine reports it.
        #
        # Reproduced and fixed empirically, not by reading version ranges: the current list
        # was replayed with `npm install --global --prefix <tmp>` (flat, exactly as CI
        # resolves) against this repo's real .releaserc.json, which failed with the error
        # above; the pinned list below then rendered `17.5.0` correctly.
        #
        # The preset pin is the load-bearing one — 9.3.1 is the newest major that renders
        # against the writer 8.x that release-notes-generator nests. A top-level
        # `conventional-changelog-writer` pin was TESTED AND DELIBERATELY OMITTED: forcing
        # writer 7.0.1 at the top level changed nothing, because the generator's nested copy
        # is what actually resolves. Adding it would be a pin that looks protective and is not.
        #
        # When bumping: bump `@semantic-release/release-notes-generator` and the preset
        # TOGETHER, and verify with the --global replay above before pushing.
        run: |
          npm install --global \
            semantic-release@25.0.9 \
            @semantic-release/changelog@6.0.3 \
            @semantic-release/commit-analyzer@13.0.1 \
            @semantic-release/release-notes-generator@14.1.1 \
            @semantic-release/github@12.0.9 \
            @semantic-release/git@10.0.1 \
            @semantic-release/npm@12.0.2 \
            @semantic-release/exec@7.1.0 \
            conventional-changelog-conventionalcommits@9.3.1

      - name: Verify semantic-release installation
        run: semantic-release --version

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: semantic-release
        # ⚠️ VERSIONING ONLY - NO PYPI PUBLISHING IN CI
        # This workflow creates GitHub releases, tags, and CHANGELOG.md only.
        # PyPI publishing happens locally via scripts/publish-to-pypi.sh (ADR-0027).
        # See: docs/development/PUBLISHING.md for complete workflow.

      - name: Summary
        if: success()
        run: echo "✅ Semantic release completed successfully"
